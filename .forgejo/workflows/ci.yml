# Forgejo CI: gofmt, vet, the test suite with the race detector, and
# `git ticket check --fix --dry-run --strict` over this repository's own ticket
# store. That last step is the second Phase 2 exit criterion in docs/plan.md
# section 13, and section 11 is why it verifies without committing.
#
# Conventions follow the instance's other repositories, and the first version
# of this file followed none of them and was red on its first run. Two rules
# matter here. Actions resolve against this Forgejo, not GitHub, so they come
# from the public Actions-Mirrors org: a bare `actions/checkout@v4` is fetched
# from this instance's own actions/checkout path and 404s before any step runs.
# And Go comes from the internal registry's golang image rather than `setup-go`,
# which would fail the same way for the same reason.
#
# The registry mirror is curated: golang:1.25-alpine is proven by the other
# repositories here. Do not assume an arbitrary library/* image is present.
#
# The image below names the internal registry, and it has to: it is a working
# reference, not prose. It is the only internal hostname anywhere in the tree,
# and it ships to the public mirror. That is a decision, not an oversight, and
# TKT-01M1FAFS holds the reasoning. Everything else says "the internal Forgejo"
# and "the internal registry", which costs a reader nothing.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Lint and Test
    runs-on: docker
    container:
      image: container.local.sothr.com/library/golang:1.25-alpine
    steps:
      - name: Install dependencies
        # git for the checkout. gcc and musl-dev are cgo, which -race needs on
        # alpine; without them the race step fails to link rather than failing
        # a test, which reads as a broken toolchain rather than a missing one.
        run: apk add --no-cache git gcc musl-dev

      - name: Checkout Code
        uses: Actions-Mirrors/forgejo-actions-checkout@v6

      - name: Download modules
        # Explicit, so a network problem fails here with a clear message rather
        # than inside the first step that happens to compile something.
        run: go mod download

      - name: gofmt check
        # gofmt -l exits zero whether or not it printed anything, so the file
        # list is the test. tee sends it to the log as well as the check.
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        # The suite is seconds, so there is no reason to run the cheap version.
        # It builds the real binary and drives it end to end through TestLifecycle.
        run: go test -race ./...

      - name: check the ticket store
        # This repository keeps its own tickets in .tickets/, so check runs
        # against a real store rather than a fixture.
        #
        # This is the verification command of plan section 11: it plans every
        # repair, writes nothing, and exits 1 when one is pending. The job
        # reports the repair and never commits it, which that section argues at
        # length. Run `just fix` locally and commit the result.
        #
        # --strict is the flag doing the work. epics_index_stale is a warning,
        # so without it a stale index exits 0 and this step goes green over the
        # condition it is here to catch. It also fails on an expired claim, or a
        # ticket in-progress with nobody holding it.
        run: |
          go build -o git-ticket ./cmd/git-ticket
          ./git-ticket check --fix --dry-run --strict
