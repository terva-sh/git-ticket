# Public release: pushing a v* tag to the mirror builds every target with
# goreleaser and publishes the archives as a GitHub Release.
#
# goreleaser publishes here itself, because github is the target it infers from
# the remote and no host has to be written down for it. The Forgejo workflow
# takes the other half of that trade: see .forgejo/workflows/release.yml.
#
# The mirror is a plain push of the same history, per AGENTS.md and plan 12.2,
# so this file lives in the same tree as the Forgejo one and both fire on the
# same tag. `git push github main --follow-tags` is what starts it.
name: release

on:
  push:
    tags:
      - "v*"

# goreleaser creates the release and uploads the archives to it.
permissions:
  contents: write

jobs:
  goreleaser:
    name: Build and Publish Release
    # Forgejo Actions executes .github/workflows too, and it reports this
    # repository as terva-sh/git-ticket exactly as GitHub does, because the
    # mirror carries the same owner and name. So the usual repository guard
    # cannot tell the two apart and this one compares the server instead.
    #
    # The guard is load-bearing rather than tidy. Without it the Forgejo runner
    # would try to resolve actions/checkout against its own instance and 404
    # before a step ran, which is the failure AGENTS.md records under Gotchas,
    # and it would race the Forgejo workflow to publish the same tag. Comparing
    # against the public URL also keeps the internal host out of this file.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history for two reasons: the changelog reads the log between
          # tags, and `go build` derives the version from the tag reachable at
          # HEAD. Plan 12.1 refuses link-time stamping, so a shallow checkout
          # would silently produce binaries reporting "devel".
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # From go.mod, so this cannot drift from what the module declares.
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published binary reports the tag
        # The same check the Forgejo workflow runs, and the one difference
        # between the two forges is worth stating plainly: there it gates the
        # upload, because that workflow does its own publishing. Here goreleaser
        # has already published by the time this runs, so this is a post-check.
        # A failure turns the job red and leaves a release somebody has to
        # delete by hand.
        #
        # It stays anyway. Catching a binary that answers "devel" an hour after
        # the tag is worth far more than not catching it, and the alternative
        # is a second full build just to move the check earlier.
        run: |
          set -eu
          tmp=$(mktemp -d)
          archive=$(ls dist/git-ticket_*_linux_amd64.tar.gz)
          tar -xzf "${archive}" -C "${tmp}"
          got=$("${tmp}/git-ticket" --version)
          echo "built: ${got}"
          case "${got}" in
            *"${GITHUB_REF_NAME}"*) echo "carries ${GITHUB_REF_NAME}" ;;
            *)
              echo "::error::the binary reports '${got}', which does not carry ${GITHUB_REF_NAME}"
              echo "The build lost its VCS stamps. Delete the release, then check"
              echo "that the checkout is not shallow before tagging again."
              exit 1
              ;;
          esac

  image:
    name: Build and Publish Image
    # After the release, not beside it. The image is built from the archive the
    # release published, so there has to be a release to download from.
    needs: goreleaser
    # The same guard, for the same reason, and it is not optional here either.
    # Forgejo Actions runs .github/workflows too and reports the same owner and
    # name, so only the server URL separates them. Per TKT-01M1SZ1X only the
    # mirror publishes images, and .forgejo/workflows has no image job at all.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    # Job-level, which replaces the contents: write above for this job alone.
    # Pushing to ghcr needs packages: write, and reading a release asset needs
    # contents: read. Nothing here writes to the repository.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        # Only the Dockerfile is wanted, so no history is needed. The version
        # comes from the archive rather than from `go build` here.
        uses: actions/checkout@v4

      - name: Work out the image tags
        id: tags
        # v0.11.2 publishes 0.11.2, 0.11 and latest, so a consumer can pin
        # exactly or float on a minor.
        #
        # A prerelease publishes its own version and nothing else. goreleaser
        # sets prerelease: auto, so v1.0.0-rc1 is already a prerelease on the
        # releases page, and moving latest onto it would hand every floating
        # consumer a release candidate. A hyphen is what marks one, per semver.
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          tags="${repo}:${version}"
          case "${version}" in
            *-*)
              echo "${GITHUB_REF_NAME} is a prerelease: publishing ${version} alone"
              ;;
            *)
              tags="${tags},${repo}:${version%.*},${repo}:latest"
              ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "tags: ${tags}"

      - name: Take the binary from the published release
        # Not a second build. What ships in the image is the artifact the
        # release shipped, and `--version` below proves it carries the tag.
        # LICENSE rides along because MIT wants the notice with every copy and
        # an image redistributes the binary exactly as an archive does.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p image-context
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'git-ticket_*_linux_amd64.tar.gz' \
            --dir image-context
          tar -xzf image-context/git-ticket_*_linux_amd64.tar.gz -C image-context
          rm -f image-context/*.tar.gz
          ls -1 image-context
          ./image-context/git-ticket --version

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The context is the unpacked archive, not this repository. The
          # Dockerfile says why: building it against the root would pick up the
          # gitignored `just build` artifact.
          context: ./image-context
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # image.source is what makes ghcr show the package against this
          # repository and inherit its visibility.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Verify the published image reports the tag
        # The same reasoning as the binary check above. A green build is not
        # evidence that what landed in the registry is what the tag names, so
        # this pulls the pushed image back and asks it.
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.tags.outputs.version }}"
          got=$(docker run --rm "${image}" git ticket --version)
          echo "image reports: ${got}"
          case "${got}" in
            *"${GITHUB_REF_NAME}"*) echo "carries ${GITHUB_REF_NAME}" ;;
            *)
              echo "::error::the image reports '${got}', which does not carry ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac
